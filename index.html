<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graveyard Grab</title>
  <link rel="icon" href="assets/icon.jpg">
  <meta name="theme-color" content="#14081f">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07040e;
      color: #f4efe6;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: min(100vw, calc(100vh * 1280 / 720));
      height: auto;
      background: #120816;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.55);
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0">
    Graveyard Grab needs a canvas-capable browser.
  </canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
